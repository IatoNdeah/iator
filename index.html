<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Iator</title>
<style>
:root{--acc:#22c55e;--bg:#0b0f17;--on:#04210f;
--card:color-mix(in srgb,var(--bg) 90%,#fff 10%);
--line:color-mix(in srgb,var(--bg) 80%,#fff 20%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#e8ecf3;font:16px system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
#app{max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 16px}h2{font-size:16px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tap:active{background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:20px}.st small{font-size:11px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.alt{background:var(--line);color:#e8ecf3}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:10px 0 4px}
.bar i{display:block;height:100%}
.g{color:#22c55e}.y{color:#eab308}.r{color:#ef4444}
.muted,small{color:#8b95a9}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;font-size:18px;margin:6px 0 12px}
input[type=color]{height:48px;padding:4px}
#m{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#m>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px 28px;max-height:90vh;overflow:auto}
.sc{display:flex;align-items:center;gap:8px}.sc label{flex:1;min-width:0}.sc input{text-align:center;font-size:28px}
.sc .btn{padding:10px 12px;margin-top:6px}
.m{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.m.old{opacity:.65}
.ic{background:none;border:0;font-size:18px;padding:6px}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--line);color:#e8ecf3;border:0;border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px}
.tabs .on{background:var(--acc);color:var(--on)}
.sec{font-size:14px;margin:16px 0 4px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.sec.old{color:#8b95a9}
#cloud{position:fixed;right:12px;bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;color:#8b95a9;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;z-index:5}
</style></head><body>
<div id="app"></div>
<div id="cloud">☁️ Conectando…</div>
<script>
const K='duelosfc_v1';
const DEF={acc:'#22c55e',bg:'#0b0f17',name:'Iator',me:'Yo'};
const PRE=[['Verde','#22c55e','#0b0f17'],['Azul','#3b82f6','#0a1020'],['Rojo','#ef4444','#140a0c'],['Dorado','#eab308','#120f06'],['Morado','#a855f7','#0f0a1a']];
let db=JSON.parse(localStorage.getItem(K)||'null')||{rivals:[],matches:[]};
db.cfg=Object.assign({},DEF,db.cfg||{});
if(db.cfg.name==='Duelos FC')db.cfg.name='Iator';
let view={r:null,tab:'all'};
const $=s=>document.querySelector(s);
const save=()=>{localStorage.setItem(K,JSON.stringify(db));window.cloudSync&&window.cloudSync()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const sg=n=>(n>0?'+':'')+n;
const cls=n=>n>0?'g':n<0?'r':'y';
const sorted=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date)||y.ts-x.ts);
const fdate=d=>d.split('-').reverse().join('/');
const ME=()=>(db.cfg.me||'').trim()||'Yo';
const rv=id=>db.rivals.find(x=>x.id===id);
const PM=(m,r)=>r&&r.flip?{...m,my:m.opp,opp:m.my}:m;
const pmAll=ms=>ms.map(m=>PM(m,rv(m.rid)));
const meN=r=>r&&r.flip?r.name:ME();
const opN=r=>r&&r.flip?ME():r.name;

function applyTheme(){
  const c=db.cfg,s=document.documentElement.style;
  const n=parseInt(c.acc.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);
  s.setProperty('--acc',c.acc);s.setProperty('--bg',c.bg);s.setProperty('--on',l>150?'#000':'#fff');
  $('meta[name=theme-color]').content=c.bg;
  document.title=c.name||DEF.name;
}

function stats(ms){
  const s={pj:ms.length,w:0,d:0,l:0,gf:0,gc:0};
  ms.forEach(m=>{s.gf+=m.my;s.gc+=m.opp;m.my>m.opp?s.w++:m.my<m.opp?s.l++:s.d++});
  s.dg=s.gf-s.gc;s.bal=s.w-s.l;
  const p=n=>s.pj?Math.round(n*1000/s.pj)/10:0;
  s.pw=p(s.w);s.pd=p(s.d);s.pl=p(s.l);
  return s;
}
const st=(v,l,c='')=>`<div class="st"><b class="${c}">${v}</b><small>${l}</small></div>`;
function statsHTML(s){
  return `<div class="grid">${st(s.pj,'Jugados')}${st(s.w,'Mis victorias','g')}${st(s.d,'Empates','y')}
${st(s.l,'Mis derrotas','r')}${st(s.l,'Victorias rival')}${st(sg(s.bal),'Balance victorias',cls(s.bal))}
${st(s.gf,'Goles a favor')}${st(s.gc,'Goles en contra')}${st(sg(s.dg),'Dif. de gol',cls(s.dg))}</div>
<div class="bar"><i style="width:${s.pw}%;background:#22c55e"></i><i style="width:${s.pd}%;background:#eab308"></i><i style="width:${s.pl}%;background:#ef4444"></i></div>
<small><span class="g">${s.pw}% victorias</span> · <span class="y">${s.pd}% empates</span> · <span class="r">${s.pl}% derrotas</span></small>`;
}

function homeView(){
  const s=stats(pmAll(db.matches));
  return `<div class="row" style="margin-bottom:0"><h1 style="margin-bottom:0">⚽ ${esc(db.cfg.name)}</h1><button class="ic" onclick="themeForm()">🎨</button></div>
<small style="display:block;margin:2px 0 16px">Creado por Iato</small>
<section class="card"><h2>Total general</h2>${statsHTML(s)}</section>
<div class="row"><h2>Rivales</h2><button class="btn" onclick="rivalForm()">+ Rival</button></div>
${db.rivals.length?db.rivals.map(r=>{
  const t=stats(pmAll(db.matches.filter(m=>m.rid===r.id)));
  return `<div class="card tap" onclick="openRival('${r.id}')"><div class="row"><b>${esc(r.name)}</b><b class="${cls(t.bal)}">${sg(t.bal)}</b></div>
<small>${t.pj} PJ · ${t.w}G ${t.d}E ${t.l}P · GF ${t.gf} GC ${t.gc}</small></div>`}).join('')
:'<p class="muted">Todavía no hay rivales. Tocá “+ Rival”.</p>'}
<section class="card"><h2>Respaldo y exportación</h2>
<div class="row"><button class="btn" onclick="exportData()">Respaldo (.json)</button>
<button class="btn alt" onclick="$('#imp').click()">Importar</button></div>
<div class="row"><button class="btn alt" style="width:100%" onclick="exportTxt()">Exportar historial completo (.txt)</button></div>
<input id="imp" type="file" accept=".json" hidden onchange="importData(this)"></section>`;
}

const TABS=[['all','Todos'],['new','EF27'],['old','EF26']];
function rowHTML(m,r){
  const p=PM(m,r);
  const c=p.my>p.opp?'g':p.my<p.opp?'r':'y';
  return `<div class="m${m.old?' old':''}"><div><b class="${c}">${esc(meN(r))} ${p.my} - ${p.opp} ${esc(opN(r))}</b><br><small>${fdate(m.date)}</small></div>
<div><button class="ic" onclick="swapMatch('${m.id}')">⇄</button><button class="ic" onclick="matchForm('${m.id}')">✏️</button><button class="ic" onclick="delMatch('${m.id}')">🗑</button></div></div>`;
}
function histHTML(ms,r){
  const n=ms.filter(m=>!m.old),o=ms.filter(m=>m.old);
  const blk=(t,a,c)=>`<h3 class="sec ${c}">${t} (${a.length})</h3>`+(a.length?a.map(m=>rowHTML(m,r)).join(''):'<p class="muted">Sin partidos.</p>');
  let h='';
  if(view.tab!=='old')h+=blk('Historial EF27',n,'');
  if(view.tab!=='new')h+=blk('Historial EF26',o,'old');
  return h;
}
function rivalView(r){
  const all=sorted(db.matches.filter(m=>m.rid===r.id));
  const ms=view.tab==='new'?all.filter(m=>!m.old):view.tab==='old'?all.filter(m=>m.old):all;
  const cnt=t=>t==='new'?all.filter(m=>!m.old).length:t==='old'?all.filter(m=>m.old).length:all.length;
  return `<div class="row"><button class="btn alt" onclick="openRival(null)">←</button>
<div><button class="ic" onclick="rivalForm('${r.id}')">✏️</button><button class="ic" onclick="delRival('${r.id}')">🗑</button></div></div>
<h1>${esc(r.name)}</h1>
<small style="display:block;margin:-8px 0 6px">Ver resultados como:</small>
<div class="tabs"><button class="${r.flip?'':'on'}" onclick="setFlip('${r.id}',false)">Soy ${esc(ME())}</button><button class="${r.flip?'on':''}" onclick="setFlip('${r.id}',true)">Soy ${esc(r.name)}</button></div>
<div class="tabs">${TABS.map(t=>`<button class="${view.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]} (${cnt(t[0])})</button>`).join('')}</div>
<section class="card"><h2>Estadísticas · ${TABS.find(t=>t[0]===view.tab)[1]}</h2>${statsHTML(stats(ms.map(m=>PM(m,r))))}</section>
<div class="row"><h2>Historial</h2><button class="btn" onclick="matchForm()">+ Partido</button></div>
<section class="card" style="padding-top:0">${histHTML(ms,r)}</section>`;
}
function setTab(t){view.tab=t;render()}
function setFlip(id,v){rv(id).flip=v;save();render()}

function render(){
  const r=view.r&&rv(view.r);
  if(view.r&&!r){view.r=null}
  $('#app').innerHTML=r?rivalView(r):homeView();
}
function openRival(id){view.r=id;view.tab='all';render();scrollTo(0,0)}

function modal(h){closeM();const d=document.createElement('div');d.id='m';d.innerHTML=`<div>${h}</div>`;document.body.appendChild(d);const i=d.querySelector('input');i&&i.focus()}
function closeM(){const m=$('#m');m&&m.remove()}

function themeForm(){
  modal(`<h2>Personalizar</h2>
<label>Nombre de la app<input maxlength="20" value="${esc(db.cfg.name)}" oninput="setCfg('name',this.value)"></label>
<label>Tu nombre (reemplaza “Yo”)<input maxlength="20" value="${esc(db.cfg.me)}" oninput="setCfg('me',this.value)"></label>
<label>Color principal<input type="color" value="${db.cfg.acc}" oninput="setCfg('acc',this.value)"></label>
<label>Color de fondo<input type="color" value="${db.cfg.bg}" oninput="setCfg('bg',this.value)"></label>
<small>Temas rápidos</small>
<div class="pr">${PRE.map((p,i)=>`<button class="btn alt" style="border-left:6px solid ${p[1]}" onclick="preset(${i})">${p[0]}</button>`).join('')}</div>
<div class="row"><button class="btn alt" onclick="resetCfg()">Restablecer</button><button class="btn" onclick="closeM()">Listo</button></div>`);
}
function setCfg(k,v){db.cfg[k]=v;save();applyTheme();if(k==='name'||k==='me')render()}
function preset(i){db.cfg.acc=PRE[i][1];db.cfg.bg=PRE[i][2];save();applyTheme();themeForm()}
function resetCfg(){db.cfg={...DEF};save();applyTheme();render();themeForm()}

function rivalForm(id){
  const r=rv(id);
  modal(`<h2>${r?'Editar':'Nuevo'} rival</h2>
<input id="f1" placeholder="Nombre del rival" maxlength="30" value="${r?esc(r.name):''}">
<div class="row"><button class="btn alt" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveRival('${id||''}')">Guardar</button></div>`);
}
function saveRival(id){
  const n=$('#f1').value.trim(); if(!n)return;
  if(id)rv(id).name=n; else db.rivals.push({id:uid(),name:n});
  save();closeM();render();
}
function delRival(id){
  if(!confirm('¿Eliminar este rival y todos sus partidos?'))return;
  db.rivals=db.rivals.filter(x=>x.id!==id);
  db.matches=db.matches.filter(m=>m.rid!==id);
  save();view.r=null;render();
}

function matchForm(id){
  const m=db.matches.find(x=>x.id===id);
  const r=rv(view.r);
  const p=m?PM(m,r):null;
  const old=m?!!m.old:view.tab==='old';
  modal(`<h2>${m?'Editar':'Nuevo'} partido</h2>
<div class="sc"><label>${esc(meN(r))}<input id="f1" type="number" inputmode="numeric" min="0" max="99" value="${p?p.my:''}"></label>
<button class="btn alt" onclick="swapFields()">⇄</button>
<label>${esc(opN(r))}<input id="f2" type="number" inputmode="numeric" min="0" max="99" value="${p?p.opp:''}"></label></div>
<small style="display:block;margin:-4px 0 12px">Tocá ⇄ para intercambiar los goles si los pusiste al revés.</small>
<label>Fecha<input id="f3" type="date" value="${m?m.date:today()}"></label>
<label>Historial<select id="f4"><option value="0"${old?'':' selected'}>EF27</option><option value="1"${old?' selected':''}>EF26</option></select></label>
<div class="row"><button class="btn alt" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveMatch('${id||''}')">Guardar</button></div>`);
}
function swapFields(){const a=$('#f1'),b=$('#f2'),t=a.value;a.value=b.value;b.value=t}
function swapMatch(id){const m=db.matches.find(x=>x.id===id);if(!m)return;[m.my,m.opp]=[m.opp,m.my];save();render()}
function saveMatch(id){
  const a=parseInt($('#f1').value),b=parseInt($('#f2').value),date=$('#f3').value,old=$('#f4').value==='1';
  if(isNaN(a)||isNaN(b)||a<0||b<0||!date){alert('Completá goles y fecha');return}
  const f=rv(view.r).flip,my=f?b:a,opp=f?a:b;
  if(id){Object.assign(db.matches.find(x=>x.id===id),{my,opp,date,old})}
  else db.matches.push({id:uid(),rid:view.r,my,opp,date,old,ts:Date.now()});
  save();closeM();render();
}
function delMatch(id){
  if(!confirm('¿Eliminar este partido?'))return;
  db.matches=db.matches.filter(x=>x.id!==id);save();render();
}

function dl(name,type,txt){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type}));
  a.download=name;a.click();
}
function exportData(){dl('iator-respaldo-'+today()+'.json','application/json',JSON.stringify(db,null,2))}
function exportTxt(){
  const sum=s=>`PJ ${s.pj} | Mis victorias ${s.w} | Empates ${s.d} | Mis derrotas ${s.l} | Victorias rival ${s.l} | GF ${s.gf} | GC ${s.gc} | Dif ${sg(s.dg)} | Balance ${sg(s.bal)} | ${s.pw}% V - ${s.pd}% E - ${s.pl}% D`;
  const fmt=(a,r)=>a.length?sorted(a).map(m=>{const p=PM(m,r);return `${fdate(m.date)}  ${meN(r)} ${p.my} - ${p.opp} ${opN(r)}`}):['(sin partidos)'];
  const L=['HISTORIAL COMPLETO - '+db.cfg.name,'Exportado: '+fdate(today()),'','TOTAL GENERAL',sum(stats(pmAll(db.matches))),''];
  db.rivals.forEach(r=>{
    const ms=db.matches.filter(m=>m.rid===r.id),n=ms.filter(m=>!m.old),o=ms.filter(m=>m.old);
    L.push('=== '+r.name.toUpperCase()+' ===','Resultados vistos como: '+meN(r),sum(stats(ms.map(m=>PM(m,r)))),'',
      '-- Historial EF27 ('+n.length+') --',...fmt(n,r),'',
      '-- Historial EF26 ('+o.length+') --',...fmt(o,r),'','');
  });
  dl('iator-historial-'+today()+'.txt','text/plain;charset=utf-8',L.join('\n'));
}
function importData(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.rivals)||!Array.isArray(d.matches))throw 0;
      if(!confirm('Esto reemplaza todos los datos actuales. ¿Continuar?'))return;
      db=d;db.cfg=Object.assign({},DEF,db.cfg||{});save();view={r:null,tab:'all'};applyTheme();render();
    }catch(e){alert('Archivo no válido')}
    inp.value='';
  };
  rd.readAsText(f);
}

applyTheme();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

<script>
/* ===== AMPLIACIONES v1: Datos:, Verificador, Historial de modificaciones. Solo leen db; no modifican partidos. ===== */
(function(){
const KL='iator_log_v1',lg=()=>{try{return JSON.parse(localStorage.getItem(KL)||'[]')}catch(e){return[]}};
const safe=f=>{try{return f()}catch(e){return{}}};
const nm=id=>(rv(id)||{name:'?'}).name;
const snap=()=>Object.fromEntries(db.matches.map(m=>[m.id,{k:JSON.stringify([m.rid,m.my,m.opp,m.date,!!m.old]),t:`${nm(m.rid)} ${m.my}-${m.opp} (${fdate(m.date||'')}, ${m.old?'EF26':'EF27'})`}]));
function track(fn,a){
  const b=safe(snap),res=fn.apply(null,a),c=safe(snap),t=new Date().toISOString(),L=[];
  for(const id in c){if(!b[id])L.push({t,k:'Alta',n:c[id].t});else if(b[id].k!==c[id].k)L.push({t,k:'Edición',a:b[id].t,n:c[id].t})}
  for(const id in b)if(!c[id])L.push({t,k:'Eliminación',a:b[id].t});
  if(L.length)try{localStorage.setItem(KL,JSON.stringify([...lg(),...L].slice(-500)))}catch(e){}
  return res;
}
['saveMatch','delMatch','swapMatch','delRival'].forEach(f=>{const o=window[f];window[f]=function(...a){return track(o,a)}});

const out=m=>m.my>m.opp?'W':m.my<m.opp?'L':'D';
const runs=(a,p)=>{let b=0,c=0;a.forEach(x=>{c=p(x)?c+1:0;b=Math.max(b,c)});return b};
const since=(a,p)=>{for(let i=a.length-1;i>=0;i--)if(p(a[i]))return a.length-1-i;return null};
const mx=(a,f)=>a.reduce((x,y)=>f(y)>f(x)?y:x,a[0]);
const per=(a,n)=>{const g={};a.forEach(m=>{const k=m.date.slice(0,n);g[k]=(g[k]||0)+Math.sign(m.my-m.opp)});const e=Object.entries(g);
  return[e.reduce((x,y)=>y[1]>x[1]?y:x,e[0]),e.reduce((x,y)=>y[1]<x[1]?y:x,e[0])]};
const R0=Math.random();
const row=(l,v)=>`<div class="m"><small>${l}</small><b style="text-align:right">${v}</b></div>`;

function datos(r){
  const ms=db.matches.filter(m=>m.rid===r.id&&m.date).sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0)).map(m=>PM(m,r));
  if(!ms.length)return `<section class="card"><h2>Datos:</h2><p class="muted">Todavía no hay partidos para calcular datos.</p></section>`;
  const A=esc(meN(r)),B=esc(opN(r)),n=ms.length,s=stats(ms),F=[];
  const d=m=>`${A} ${m.my}-${m.opp} ${B} · ${fdate(m.date)}`;
  const add=(g,l,v)=>F.push([g,l,v]);
  const fm=v=>v===null?`nunca ganó (${n} PJ)`:v===0?'ganó el último':`${v} sin ganar`;
  add(0,'Promedio de goles por partido',`${((s.gf+s.gc)/n).toFixed(2)} (${A} ${(s.gf/n).toFixed(2)} · ${B} ${(s.gc/n).toFixed(2)})`);
  add(0,'Ventaja histórica',s.bal===0?'Igualados en victorias':`${s.bal>0?A:B} +${Math.abs(s.bal)} victorias`);
  add(0,'Diferencia de goles',s.dg===0?'Igualados':`${s.dg>0?A:B} +${Math.abs(s.dg)}`);
  [5,10].forEach(k=>{if(n>=1){const t=stats(ms.slice(-k));add(0,`Últimos ${Math.min(k,n)} (${A})`,`${t.w}G ${t.d}E ${t.l}P`)}});
  add(0,'Últimos 10 (desde '+A+')',ms.slice(-10).map(m=>({W:'G',D:'E',L:'P'})[out(m)]).join(' '));
  const L=ms[n-1];add(0,'Último encuentro',`${out(L)==='W'?A:out(L)==='L'?B:'Empate'} · ${d(L)}`);
  let c=0;const lo=out(L);for(let i=n-1;i>=0&&out(ms[i])===lo;i--)c++;
  add(1,'Racha actual',lo==='D'?`${c} empate(s) seguido(s)`:`${lo==='W'?A:B}: ${c} victoria(s) seguida(s)`);
