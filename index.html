<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Iator</title>
<style>
:root{--acc:#22c55e;--bg:#0b0f17;--on:#04210f;
--card:color-mix(in srgb,var(--bg) 90%,#fff 10%);
--line:color-mix(in srgb,var(--bg) 80%,#fff 20%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#e8ecf3;font:16px system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
#app{max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 16px}h2{font-size:16px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tap:active{background:var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:20px}.st small{font-size:11px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.alt{background:var(--line);color:#e8ecf3}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:10px 0 4px}
.bar i{display:block;height:100%}
.g{color:#22c55e}.y{color:#eab308}.r{color:#ef4444}
.muted,small{color:#8b95a9}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;font-size:18px;margin:6px 0 12px}
input[type=color]{height:48px;padding:4px}
#m{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#m>div{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px 28px;max-height:90vh;overflow:auto}
.sc{display:flex;align-items:center;gap:8px}.sc label{flex:1;min-width:0}.sc input{text-align:center;font-size:28px}
.sc .btn{padding:10px 12px;margin-top:6px}
.m{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.m.old{opacity:.65}
.ic{background:none;border:0;font-size:18px;padding:6px}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:var(--line);color:#e8ecf3;border:0;border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px}
.tabs .on{background:var(--acc);color:var(--on)}
.sec{font-size:14px;margin:16px 0 4px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
.sec.old{color:#8b95a9}
#cloud{position:fixed;right:12px;bottom:max(10px,env(safe-area-inset-bottom));font-size:12px;color:#8b95a9;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;z-index:5}
</style></head><body>
<div id="app"></div>
<div id="cloud">☁️ Conectando…</div>
<script>
const K='duelosfc_v1';
const DEF={acc:'#22c55e',bg:'#0b0f17',name:'Iator',me:'Yo'};
const PRE=[['Verde','#22c55e','#0b0f17'],['Azul','#3b82f6','#0a1020'],['Rojo','#ef4444','#140a0c'],['Dorado','#eab308','#120f06'],['Morado','#a855f7','#0f0a1a']];
let db=JSON.parse(localStorage.getItem(K)||'null')||{rivals:[],matches:[]};
db.cfg=Object.assign({},DEF,db.cfg||{});
if(db.cfg.name==='Duelos FC')db.cfg.name='Iator';
let view={r:null,tab:'all'};
const $=s=>document.querySelector(s);
const save=()=>{localStorage.setItem(K,JSON.stringify(db));window.cloudSync&&window.cloudSync()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const sg=n=>(n>0?'+':'')+n;
const cls=n=>n>0?'g':n<0?'r':'y';
const sorted=a=>[...a].sort((x,y)=>y.date.localeCompare(x.date)||y.ts-x.ts);
const fdate=d=>d.split('-').reverse().join('/');
const ME=()=>(db.cfg.me||'').trim()||'Yo';
const rv=id=>db.rivals.find(x=>x.id===id);
const PM=(m,r)=>r&&r.flip?{...m,my:m.opp,opp:m.my}:m;
const pmAll=ms=>ms.map(m=>PM(m,rv(m.rid)));
const meN=r=>r&&r.flip?r.name:ME();
const opN=r=>r&&r.flip?ME():r.name;

function applyTheme(){
  const c=db.cfg,s=document.documentElement.style;
  const n=parseInt(c.acc.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);
  s.setProperty('--acc',c.acc);s.setProperty('--bg',c.bg);s.setProperty('--on',l>150?'#000':'#fff');
  $('meta[name=theme-color]').content=c.bg;
  document.title=c.name||DEF.name;
}

function stats(ms){
  const s={pj:ms.length,w:0,d:0,l:0,gf:0,gc:0};
  ms.forEach(m=>{s.gf+=m.my;s.gc+=m.opp;m.my>m.opp?s.w++:m.my<m.opp?s.l++:s.d++});
  s.dg=s.gf-s.gc;s.bal=s.w-s.l;
  const p=n=>s.pj?Math.round(n*1000/s.pj)/10:0;
  s.pw=p(s.w);s.pd=p(s.d);s.pl=p(s.l);
  return s;
}
const st=(v,l,c='')=>`<div class="st"><b class="${c}">${v}</b><small>${l}</small></div>`;
function statsHTML(s){
  return `<div class="grid">${st(s.pj,'Jugados')}${st(s.w,'Mis victorias','g')}${st(s.d,'Empates','y')}
${st(s.l,'Mis derrotas','r')}${st(s.l,'Victorias rival')}${st(sg(s.bal),'Balance victorias',cls(s.bal))}
${st(s.gf,'Goles a favor')}${st(s.gc,'Goles en contra')}${st(sg(s.dg),'Dif. de gol',cls(s.dg))}</div>
<div class="bar"><i style="width:${s.pw}%;background:#22c55e"></i><i style="width:${s.pd}%;background:#eab308"></i><i style="width:${s.pl}%;background:#ef4444"></i></div>
<small><span class="g">${s.pw}% victorias</span> · <span class="y">${s.pd}% empates</span> · <span class="r">${s.pl}% derrotas</span></small>`;
}

function homeView(){
  const s=stats(pmAll(db.matches));
  return `<div class="row" style="margin-bottom:0"><h1 style="margin-bottom:0">⚽ ${esc(db.cfg.name)}</h1><button class="ic" onclick="themeForm()">🎨</button></div>
<small style="display:block;margin:2px 0 16px">Creado por Iato</small>
<section class="card"><h2>Total general</h2>${statsHTML(s)}</section>
<div class="row"><h2>Rivales</h2><button class="btn" onclick="rivalForm()">+ Rival</button></div>
${db.rivals.length?db.rivals.map(r=>{
  const t=stats(pmAll(db.matches.filter(m=>m.rid===r.id)));
  return `<div class="card tap" onclick="openRival('${r.id}')"><div class="row"><b>${esc(r.name)}</b><b class="${cls(t.bal)}">${sg(t.bal)}</b></div>
<small>${t.pj} PJ · ${t.w}G ${t.d}E ${t.l}P · GF ${t.gf} GC ${t.gc}</small></div>`}).join('')
:'<p class="muted">Todavía no hay rivales. Tocá “+ Rival”.</p>'}
<section class="card"><h2>Respaldo y exportación</h2>
<div class="row"><button class="btn" onclick="exportData()">Respaldo (.json)</button>
<button class="btn alt" onclick="$('#imp').click()">Importar</button></div>
<div class="row"><button class="btn alt" style="width:100%" onclick="exportTxt()">Exportar historial completo (.txt)</button></div>
<input id="imp" type="file" accept=".json" hidden onchange="importData(this)"></section>`;
}

const TABS=[['all','Todos'],['new','EF27'],['old','EF26']];
function rowHTML(m,r){
  const p=PM(m,r);
  const c=p.my>p.opp?'g':p.my<p.opp?'r':'y';
  return `<div class="m${m.old?' old':''}"><div><b class="${c}">${esc(meN(r))} ${p.my} - ${p.opp} ${esc(opN(r))}</b><br><small>${fdate(m.date)}</small></div>
<div><button class="ic" onclick="swapMatch('${m.id}')">⇄</button><button class="ic" onclick="matchForm('${m.id}')">✏️</button><button class="ic" onclick="delMatch('${m.id}')">🗑</button></div></div>`;
}
function histHTML(ms,r){
  const n=ms.filter(m=>!m.old),o=ms.filter(m=>m.old);
  const blk=(t,a,c)=>`<h3 class="sec ${c}">${t} (${a.length})</h3>`+(a.length?a.map(m=>rowHTML(m,r)).join(''):'<p class="muted">Sin partidos.</p>');
  let h='';
  if(view.tab!=='old')h+=blk('Historial EF27',n,'');
  if(view.tab!=='new')h+=blk('Historial EF26',o,'old');
  return h;
}
function rivalView(r){
  const all=sorted(db.matches.filter(m=>m.rid===r.id));
  const ms=view.tab==='new'?all.filter(m=>!m.old):view.tab==='old'?all.filter(m=>m.old):all;
  const cnt=t=>t==='new'?all.filter(m=>!m.old).length:t==='old'?all.filter(m=>m.old).length:all.length;
  return `<div class="row"><button class="btn alt" onclick="openRival(null)">←</button>
<div><button class="ic" onclick="rivalForm('${r.id}')">✏️</button><button class="ic" onclick="delRival('${r.id}')">🗑</button></div></div>
<h1>${esc(r.name)}</h1>
<small style="display:block;margin:-8px 0 6px">Ver resultados como:</small>
<div class="tabs"><button class="${r.flip?'':'on'}" onclick="setFlip('${r.id}',false)">Soy ${esc(ME())}</button><button class="${r.flip?'on':''}" onclick="setFlip('${r.id}',true)">Soy ${esc(r.name)}</button></div>
<div class="tabs">${TABS.map(t=>`<button class="${view.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]} (${cnt(t[0])})</button>`).join('')}</div>
<section class="card"><h2>Estadísticas · ${TABS.find(t=>t[0]===view.tab)[1]}</h2>${statsHTML(stats(ms.map(m=>PM(m,r))))}</section>
<div class="row"><h2>Historial</h2><button class="btn" onclick="matchForm()">+ Partido</button></div>
<section class="card" style="padding-top:0">${histHTML(ms,r)}</section>`;
}
function setTab(t){view.tab=t;render()}
function setFlip(id,v){rv(id).flip=v;save();render()}

function render(){
  const r=view.r&&rv(view.r);
  if(view.r&&!r){view.r=null}
  $('#app').innerHTML=r?rivalView(r):homeView();
}
function openRival(id){view.r=id;view.tab='all';render();scrollTo(0,0)}

function modal(h){closeM();const d=document.createElement('div');d.id='m';d.innerHTML=`<div>${h}</div>`;document.body.appendChild(d);const i=d.querySelector('input');i&&i.focus()}
function closeM(){const m=$('#m');m&&m.remove()}

function themeForm(){
  modal(`<h2>Personalizar</h2>
<label>Nombre de la app<input maxlength="20" value="${esc(db.cfg.name)}" oninput="setCfg('name',this.value)"></label>
<label>Tu nombre (reemplaza “Yo”)<input maxlength="20" value="${esc(db.cfg.me)}" oninput="setCfg('me',this.value)"></label>
<label>Color principal<input type="color" value="${db.cfg.acc}" oninput="setCfg('acc',this.value)"></label>
<label>Color de fondo<input type="color" value="${db.cfg.bg}" oninput="setCfg('bg',this.value)"></label>
<small>Temas rápidos</small>
<div class="pr">${PRE.map((p,i)=>`<button class="btn alt" style="border-left:6px solid ${p[1]}" onclick="preset(${i})">${p[0]}</button>`).join('')}</div>
<div class="row"><button class="btn alt" onclick="resetCfg()">Restablecer</button><button class="btn" onclick="closeM()">Listo</button></div>`);
}
function setCfg(k,v){db.cfg[k]=v;save();applyTheme();if(k==='name'||k==='me')render()}
function preset(i){db.cfg.acc=PRE[i][1];db.cfg.bg=PRE[i][2];save();applyTheme();themeForm()}
function resetCfg(){db.cfg={...DEF};save();applyTheme();render();themeForm()}

function rivalForm(id){
  const r=rv(id);
  modal(`<h2>${r?'Editar':'Nuevo'} rival</h2>
<input id="f1" placeholder="Nombre del rival" maxlength="30" value="${r?esc(r.name):''}">
<div class="row"><button class="btn alt" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveRival('${id||''}')">Guardar</button></div>`);
}
function saveRival(id){
  const n=$('#f1').value.trim(); if(!n)return;
  if(id)rv(id).name=n; else db.rivals.push({id:uid(),name:n});
  save();closeM();render();
}
function delRival(id){
  if(!confirm('¿Eliminar este rival y todos sus partidos?'))return;
  db.rivals=db.rivals.filter(x=>x.id!==id);
  db.matches=db.matches.filter(m=>m.rid!==id);
  save();view.r=null;render();
}

function matchForm(id){
  const m=db.matches.find(x=>x.id===id);
  const r=rv(view.r);
  const p=m?PM(m,r):null;
  const old=m?!!m.old:view.tab==='old';
  modal(`<h2>${m?'Editar':'Nuevo'} partido</h2>
<div class="sc"><label>${esc(meN(r))}<input id="f1" type="number" inputmode="numeric" min="0" max="99" value="${p?p.my:''}"></label>
<button class="btn alt" onclick="swapFields()">⇄</button>
<label>${esc(opN(r))}<input id="f2" type="number" inputmode="numeric" min="0" max="99" value="${p?p.opp:''}"></label></div>
<small style="display:block;margin:-4px 0 12px">Tocá ⇄ para intercambiar los goles si los pusiste al revés.</small>
<label>Fecha<input id="f3" type="date" value="${m?m.date:today()}"></label>
<label>Historial<select id="f4"><option value="0"${old?'':' selected'}>EF27</option><option value="1"${old?' selected':''}>EF26</option></select></label>
<div class="row"><button class="btn alt" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveMatch('${id||''}')">Guardar</button></div>`);
}
function swapFields(){const a=$('#f1'),b=$('#f2'),t=a.value;a.value=b.value;b.value=t}
function swapMatch(id){const m=db.matches.find(x=>x.id===id);if(!m)return;[m.my,m.opp]=[m.opp,m.my];save();render()}
function saveMatch(id){
  const a=parseInt($('#f1').value),b=parseInt($('#f2').value),date=$('#f3').value,old=$('#f4').value==='1';
  if(isNaN(a)||isNaN(b)||a<0||b<0||!date){alert('Completá goles y fecha');return}
  const f=rv(view.r).flip,my=f?b:a,opp=f?a:b;
  if(id){Object.assign(db.matches.find(x=>x.id===id),{my,opp,date,old})}
  else db.matches.push({id:uid(),rid:view.r,my,opp,date,old,ts:Date.now()});
  save();closeM();render();
}
function delMatch(id){
  if(!confirm('¿Eliminar este partido?'))return;
  db.matches=db.matches.filter(x=>x.id!==id);save();render();
}

function dl(name,type,txt){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type}));
  a.download=name;a.click();
}
function exportData(){dl('iator-respaldo-'+today()+'.json','application/json',JSON.stringify(db,null,2))}
function exportTxt(){
  const sum=s=>`PJ ${s.pj} | Mis victorias ${s.w} | Empates ${s.d} | Mis derrotas ${s.l} | Victorias rival ${s.l} | GF ${s.gf} | GC ${s.gc} | Dif ${sg(s.dg)} | Balance ${sg(s.bal)} | ${s.pw}% V - ${s.pd}% E - ${s.pl}% D`;
  const fmt=(a,r)=>a.length?sorted(a).map(m=>{const p=PM(m,r);return `${fdate(m.date)}  ${meN(r)} ${p.my} - ${p.opp} ${opN(r)}`}):['(sin partidos)'];
  const L=['HISTORIAL COMPLETO - '+db.cfg.name,'Exportado: '+fdate(today()),'','TOTAL GENERAL',sum(stats(pmAll(db.matches))),''];
  db.rivals.forEach(r=>{
    const ms=db.matches.filter(m=>m.rid===r.id),n=ms.filter(m=>!m.old),o=ms.filter(m=>m.old);
    L.push('=== '+r.name.toUpperCase()+' ===','Resultados vistos como: '+meN(r),sum(stats(ms.map(m=>PM(m,r)))),'',
      '-- Historial EF27 ('+n.length+') --',...fmt(n,r),'',
      '-- Historial EF26 ('+o.length+') --',...fmt(o,r),'','');
  });
  dl('iator-historial-'+today()+'.txt','text/plain;charset=utf-8',L.join('\n'));
}
function importData(inp){
  const f=inp.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d.rivals)||!Array.isArray(d.matches))throw 0;
      if(!confirm('Esto reemplaza todos los datos actuales. ¿Continuar?'))return;
      db=d;db.cfg=Object.assign({},DEF,db.cfg||{});save();view={r:null,tab:'all'};applyTheme();render();
    }catch(e){alert('Archivo no válido')}
    inp.value='';
  };
  rd.readAsText(f);
}

applyTheme();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

<style>
/* Apartados plegables (solo estilos nuevos) */
.fold{margin-bottom:12px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.fh:active{background:var(--line)}
.fh b{font-size:16px}.fh small{font-size:13px}
.fh .ar{color:var(--acc);font-size:20px;flex:none}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.fold.open .fb{grid-template-rows:1fr}
.fi{min-height:0;overflow:hidden;visibility:hidden;transition:visibility .3s}
.fold.open .fi{visibility:visible}
.fi>:first-child{margin-top:8px}
</style>
<script>
/* ===== AMPLIACIONES v1: Datos:, Verificador, Historial de modificaciones. Solo leen db; no modifican partidos. ===== */
(function(){
const KL='iator_log_v1',lg=()=>{try{return JSON.parse(localStorage.getItem(KL)||'[]')}catch(e){return[]}};
const safe=f=>{try{return f()}catch(e){return{}}};
const nm=id=>(rv(id)||{name:'?'}).name;
const snap=()=>Object.fromEntries(db.matches.map(m=>[m.id,{k:JSON.stringify([m.rid,m.my,m.opp,m.date,!!m.old]),t:`${nm(m.rid)} ${m.my}-${m.opp} (${fdate(m.date||'')}, ${m.old?'EF26':'EF27'})`}]));
function track(fn,a){
  const b=safe(snap),res=fn.apply(null,a),c=safe(snap),t=new Date().toISOString(),L=[];
  for(const id in c){if(!b[id])L.push({t,k:'Alta',n:c[id].t});else if(b[id].k!==c[id].k)L.push({t,k:'Edición',a:b[id].t,n:c[id].t})}
  for(const id in b)if(!c[id])L.push({t,k:'Eliminación',a:b[id].t});
  if(L.length)try{localStorage.setItem(KL,JSON.stringify([...lg(),...L].slice(-500)))}catch(e){}
  return res;
}
['saveMatch','delMatch','swapMatch','delRival'].forEach(f=>{const o=window[f];window[f]=function(...a){return track(o,a)}});

const out=m=>m.my>m.opp?'W':m.my<m.opp?'L':'D';
const chip=k=>`<span class="ch ${k}">${{W:'V',D:'E',L:'D'}[k]}</span>`;
const runs=(a,p)=>{let b=0,c=0;a.forEach(x=>{c=p(x)?c+1:0;b=Math.max(b,c)});return b};
const since=(a,p)=>{for(let i=a.length-1;i>=0;i--)if(p(a[i]))return a.length-1-i;return null};
const mx=(a,f)=>a.reduce((x,y)=>f(y)>f(x)?y:x,a[0]);
const per=(a,n)=>{const g={};a.forEach(m=>{const k=m.date.slice(0,n);g[k]=(g[k]||0)+Math.sign(m.my-m.opp)});const e=Object.entries(g);
  return[e.reduce((x,y)=>y[1]>x[1]?y:x,e[0]),e.reduce((x,y)=>y[1]<x[1]?y:x,e[0])]};
const R0=Math.random();
const row=(l,v)=>`<div class="m"><small>${l}</small><b style="text-align:right">${v}</b></div>`;

function datos(r){
  const ms=db.matches.filter(m=>m.rid===r.id&&m.date).sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0)).map(m=>PM(m,r));
  if(!ms.length)return `<section class="card dt"><h2>Datos:</h2><p class="muted">Todavía no hay partidos para calcular datos.</p></section>`;
  const A=esc(meN(r)),B=esc(opN(r)),n=ms.length,s=stats(ms),F=[];
  const d=m=>`${A} ${m.my}-${m.opp} ${B} · ${fdate(m.date)}`;
  const add=(g,l,v)=>F.push([g,l,v]);
  const fm=v=>v===null?`nunca ganó (${n} PJ)`:v===0?'ganó el último':`${v} sin ganar`;
  add(0,'Promedio de goles por partido',`${((s.gf+s.gc)/n).toFixed(2)} (${A} ${(s.gf/n).toFixed(2)} · ${B} ${(s.gc/n).toFixed(2)})`);
  add(0,'Ventaja histórica',s.bal===0?'Igualados en victorias':`${s.bal>0?A:B} +${Math.abs(s.bal)} victorias`);
  add(0,'Diferencia de goles',s.dg===0?'Igualados':`${s.dg>0?A:B} +${Math.abs(s.dg)}`);
  [5,10].forEach(k=>{if(n>=1){const t=stats(ms.slice(-k));add(0,`Últimos ${Math.min(k,n)} (${A})`,`${t.w}G ${t.d}E ${t.l}P`)}});
  add(0,'Últimos 10 (desde '+A+')',ms.slice(-10).map(m=>chip(out(m))).join(''));
  const L=ms[n-1];add(0,'Último encuentro',`${out(L)==='W'?A:out(L)==='L'?B:'Empate'} · ${d(L)}`);
  let c=0;const lo=out(L);for(let i=n-1;i>=0&&out(ms[i])===lo;i--)c++;
  add(1,'Racha actual',chip(lo).repeat(Math.min(c,10))+' '+(lo==='D'?`${c} empate(s) seguido(s)`:`${lo==='W'?A:B}: ${c} victoria(s) seguida(s)`));
  add(1,'Mayor racha de victorias',`${A} ${runs(ms,m=>m.my>m.opp)} · ${B} ${runs(ms,m=>m.my<m.opp)}`);
  add(1,'Mayor racha sin perder',`${A} ${runs(ms,m=>m.my>=m.opp)} · ${B} ${runs(ms,m=>m.my<=m.opp)}`);
  add(1,'Mayor racha sin ganar (sequía histórica)',`${A} ${runs(ms,m=>m.my<=m.opp)} · ${B} ${runs(ms,m=>m.my>=m.opp)}`);
  add(1,'Sequía actual',`${A}: ${fm(since(ms,m=>m.my>m.opp))} · ${B}: ${fm(since(ms,m=>m.my<m.opp))}`);
  const ga=mx(ms,m=>m.my-m.opp),gb=mx(ms,m=>m.opp-m.my);
  add(2,'Mayor goleada de '+A,ga.my>ga.opp?d(ga):'—');
  add(2,'Mayor goleada de '+B,gb.opp>gb.my?d(gb):'—');
  add(2,'Partido con más goles',`${d(mx(ms,m=>m.my+m.opp))} (${mx(ms,m=>m.my+m.opp).my+mx(ms,m=>m.my+m.opp).opp})`);
  const gp=mx(ms,m=>Math.max(m.my,m.opp));add(2,'Más goles de un jugador en un partido',`${gp.my>=gp.opp?A:B} ${Math.max(gp.my,gp.opp)} · ${fdate(gp.date)}`);
  const cs={};ms.forEach(m=>{const k=m.my+'-'+m.opp;cs[k]=(cs[k]||0)+1});const top=Object.entries(cs).sort((x,y)=>y[1]-x[1])[0];
  add(2,'Marcador más repetido',top[1]>1?`${top[0]} (${top[1]} veces)`:'Ninguno se repite');
  [['mes',7],['año',4]].forEach(([nom,len])=>{const[hi,lw]=per(ms,len);
    add(2,`Mejor ${nom} de ${A}`,hi[1]>0?`${hi[0]} (+${hi[1]})`:'—');add(2,`Mejor ${nom} de ${B}`,lw[1]<0?`${lw[0]} (+${-lw[1]})`:'—')});
  const G=['Cara a cara','Rachas y sequías','Récords'];
  const pick=F[Math.floor(R0*F.length)];
  return `<section class="card dt"><h2>Datos:</h2>
<div class="st" style="text-align:left;margin-bottom:8px"><small>Estadística del día</small><b style="font-size:15px">${pick[1]}: ${pick[2]}</b></div>
${G.map((t,i)=>`<div class="dg dg${i}"><h3 class="sec">${t}</h3>`+F.filter(f=>f[0]===i).map(f=>row(f[1],f[2])).join('')+'</div>').join('')}</section>`;
}

function verify(){
  const W=[],seen={},td=today();
  db.matches.forEach(m=>{
    const r=rv(m.rid),lab=`${esc(r?r.name:'(rival inexistente)')} ${esc(m.my)}-${esc(m.opp)} · ${esc(m.date||'sin fecha')}`,p=(t,s)=>W.push([lab,t,s||'y']);
    const ok=Number.isInteger(m.my)&&Number.isInteger(m.opp)&&m.my>=0&&m.opp>=0;
    if(!r)p('Pertenece a un rival que no existe.','r');
    if(!ok)p('Marcador incompleto o no numérico.','r');
    if(!/^\d{4}-\d\d-\d\d$/.test(m.date||'')||isNaN(new Date(m.date)))p('Fecha inválida o ausente.','r');
    else if(m.date>td)p('Fecha futura.');
    if(ok&&(m.my+m.opp>=10||Math.abs(m.my-m.opp)>=6))p('Marcador inusual (puede estar bien).');
    const k=[m.rid,m.my,m.opp,m.date].join('|');(seen[k]=seen[k]||{n:0,lab}).n++;
  });
  Object.values(seen).forEach(o=>{if(o.n>1)W.push([o.lab,`Posible duplicado: ${o.n} partidos con mismo rival, marcador y fecha (puede ser legítimo).`])});
  return `<section class="card" id="ver"><h2>Verificador de datos</h2><small style="display:block;margin-bottom:6px">Solo avisa: no edita, corrige ni borra nada.</small>${W.length?`<small style="display:block;margin-bottom:6px"><span class="y">${W.filter(w=>w[2]!=='r').length} advertencia(s)</span> · <span class="r">${W.filter(w=>w[2]==='r').length} posible(s) error(es) grave(s)</span></small>`:''}
${W.length?W.map(w=>`<div class="m w${w[2]||'y'}" style="display:block"><span class="tg t${w[2]||'y'}">${w[2]==='r'?'POSIBLE ERROR GRAVE':'ADVERTENCIA'}</span><b>${w[0]}</b><br><small>${w[1]}</small></div>`).join(''):'<p class="muted">Sin avisos. No se detectó nada raro.</p>'}</section>`;
}

function logHTML(){
  const l=lg().reverse().slice(0,50),f=t=>new Date(t).toLocaleString('es');
  return `<section class="card"><h2>Historial de modificaciones</h2>
${l.length?l.map(e=>`<div class="m" style="display:block"><small>${f(e.t)} · <span class="tg tg${e.k==='Alta'?'a':e.k==='Edición'?'e':'x'}">${e.k}</span></small><br><b style="font-size:14px">${e.a?esc(e.a):''}${e.a&&e.n?' → ':''}${e.n?esc(e.n):''}</b></div>`).join(''):'<p class="muted">Todavía no hay cambios registrados. Se registran desde ahora (altas, ediciones y eliminaciones hechas en este dispositivo).</p>'}</section>`;

const UI='iator_ui_v1';let op={};try{op=JSON.parse(localStorage.getItem(UI))||{}}catch(e){}
function fold(key,title,nodes,hide){
  if(!nodes[0]||!nodes[nodes.length-1])return;
  const f=document.createElement('div'),h=document.createElement('div'),b=document.createElement('div'),i=document.createElement('div');
  f.className='fold k-'+key;h.className='fh';b.className='fb';i.className='fi';h.setAttribute('role','button');h.tabIndex=0;

  h.addEventListener('click',tg);

<script>
/* ===== ESTADÍSTICAS DE PARTIDO v1: carga manual por partido. Se guardan aparte en db.mstats; no modifican rivals ni matches. ===== */
(function(){
const FIELDS=[['pos','Posesión del balón'],['shots','Disparos'],['sot','Disparos al arco'],['fouls','Faltas'],['offs','Fueras de juego'],['corn','Tiros de esquina'],['fk','Tiros libres'],['pass','Pases'],['passok','Pases completados'],['cross','Centros'],['icpt','Pases interceptados'],['tack','Entradas'],['saves','Paradas']];
window.MSTAT_FIELDS=FIELDS;
const KD='iator_mstats_del';
const MS=()=>db.mstats&&typeof db.mstats==='object'&&!Array.isArray(db.mstats)?db.mstats:(db.mstats={});
const mx=k=>k==='pos'?100:999;
const q=()=>{try{return JSON.parse(localStorage.getItem(KD)||'[]')}catch(e){return[]}};

/* Alta / baja de estadísticas (la baja se avisa a la nube desde el módulo aparte) */
window.mstatsPut=function(id,rec){
  MS()[id]=rec;
  try{localStorage.setItem(KD,JSON.stringify(q().filter(x=>x!==id)))}catch(e){}
  save();window.mstatsSync&&window.mstatsSync();
};
window.mstatsDel=function(id){
  const m=MS();if(!(id in m))return;
  delete m[id];
  try{const l=q();if(!l.includes(id))l.push(id);localStorage.setItem(KD,JSON.stringify(l))}catch(e){}
  save();window.mstatsFlush&&window.mstatsFlush();
};

/* a = lado de "my" del partido, b = lado de "opp" (igual que los goles); "Soy X" solo cambia cómo se muestra */
const side=(o,s,f)=>{if(!o)return null;const v=o[(s==='l')!==f?'a':'b'];return v==null?null:v};
const hasAny=rec=>!!rec&&FIELDS.some(([k])=>rec[k]);

window.statsForm=function(id){
  const m=db.matches.find(x=>x.id===id),r=m&&rv(m.rid);if(!m||!r)return;
  const rec=MS()[id]||{},f=!!r.flip,p=PM(m,r);
  const inp=(k,s)=>{const v=side(rec[k],s,f);return `<input data-k="${k}" data-s="${s}" type="number" inputmode="numeric" min="0" max="${mx(k)}" value="${v==null?'':v}">`};
  modal(`<h2>Estadísticas del partido</h2>
<small style="display:block;margin-bottom:10px">${esc(meN(r))} ${p.my} - ${p.opp} ${esc(opN(r))} · ${fdate(m.date)}<br>Dejá vacío lo que no tengas. Solo números.</small>
<div class="xs xh"><b class="gf">${esc(meN(r))}</b><span></span><b class="gc">${esc(opN(r))}</b></div>
${FIELDS.map(([k,l])=>`<div class="xs">${inp(k,'l')}<span>${l}</span>${inp(k,'r')}</div>`).join('')}
<div class="row" style="margin-top:14px"><button class="btn alt" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveStats('${id}')">Guardar</button></div>`);
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  /* comodidad: si cargás la posesión de un lado y el otro está vacío, propone 100 - valor */
  document.querySelectorAll('#m [data-k="pos"]').forEach(e=>e.addEventListener('change',()=>{
    const o=document.querySelector('#m [data-k="pos"][data-s="'+(e.dataset.s==='l'?'r':'l')+'"]'),v=Number(e.value);
    if(o&&o.value===''&&e.value!==''&&v>=0&&v<=100)o.value=100-v;
  }));
};

window.saveStats=function(id){
  const m=db.matches.find(x=>x.id===id),r=m&&rv(m.rid);if(!m||!r)return;
  const f=!!r.flip,rec={};let bad=false;
  const num=(el,max)=>{const v=el.value.trim();if(v==='')return null;const n=Number(v);return Number.isInteger(n)&&n>=0&&n<=max?n:NaN};
  FIELDS.forEach(([k])=>{
    const x=num(document.querySelector('#m [data-k="'+k+'"][data-s="l"]'),mx(k)),y=num(document.querySelector('#m [data-k="'+k+'"][data-s="r"]'),mx(k));
    if(Number.isNaN(x)||Number.isNaN(y)){bad=true;return}
    if(x===null&&y===null)return;
    const o={};if(x!==null)o[f?'b':'a']=x;if(y!==null)o[f?'a':'b']=y;rec[k]=o;
  });
  if(bad){alert('Revisá los valores: solo números enteros (la posesión va de 0 a 100).');return}
  if(!hasAny(rec)){
    if(hasAny(MS()[id])){if(confirm('Dejaste todo vacío. ¿Borrar las estadísticas de este partido?')){mstatsDel(id);closeM();render()}return}
    alert('No cargaste ningún valor.');return;
  }
  const W=[],g=(k,s)=>rec[k]&&rec[k][s];
  if(rec.pos&&rec.pos.a!=null&&rec.pos.b!=null&&rec.pos.a+rec.pos.b!==100)W.push('La posesión de los dos lados no suma 100 %.');
  ['a','b'].forEach(s=>{
    if(g('shots',s)!=null&&g('sot',s)!=null&&g('sot',s)>g('shots',s))W.push('Disparos al arco es mayor que Disparos.');
    if(g('pass',s)!=null&&g('passok',s)!=null&&g('passok',s)>g('pass',s))W.push('Pases completados es mayor que Pases.');
  });
  if(W.length&&!confirm('Hay valores raros:\n• '+[...new Set(W)].join('\n• ')+'\n\n¿Guardar igual?'))return;
  rec.ts=Date.now();
  mstatsPut(id,rec);closeM();render();statsView(id);
};

window.statsView=function(id){
  const m=db.matches.find(x=>x.id===id),r=m&&rv(m.rid);if(!m||!r)return;
  const rec=MS()[id];if(!hasAny(rec)){statsForm(id);return}
  const f=!!r.flip,p=PM(m,r);
  const rows=FIELDS.filter(([k])=>rec[k]).map(([k,l])=>{
    const x=side(rec[k],'l',f),y=side(rec[k],'r',f),t=(x||0)+(y||0),both=x!=null&&y!=null&&t>0;
    const px=both?x*100/t:0,py=both?y*100/t:0,u=k==='pos'?'%':'';
    return `<div class="xr"><div class="xv${x!=null&&(y==null||x>y)?' xw':''}">${x==null?'–':x+u}</div><div class="xl">${l}<div class="xb"><i style="width:${px}%;background:var(--gf)"></i><i style="width:${py}%;background:var(--go)"></i></div></div><div class="xv${y!=null&&(x==null||y>x)?' xw':''}">${y==null?'–':y+u}</div></div>`;
  }).join('');
  modal(`<h2>Estadísticas del partido</h2>
<small style="display:block;margin-bottom:6px"><b class="gf">${esc(meN(r))}</b> ${p.my} - ${p.opp} <b class="gc">${esc(opN(r))}</b> · ${fdate(m.date)}</small>
${rows}
<div class="row" style="margin-top:14px"><button class="btn alt" onclick="closeM()">Cerrar</button><button class="btn" onclick="statsForm('${id}')">✏️ Editar</button></div>
<div class="row"><button class="btn alt" style="width:100%" onclick="statsBorrar('${id}')">🗑 Borrar estadísticas</button></div>`);
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
};
window.statsBorrar=function(id){
  if(!confirm('¿Borrar las estadísticas de este partido? El partido no se toca.'))return;
  mstatsDel(id);closeM();render();
};

/* Si se intercambian los goles (⇄), se intercambian también los lados de las estadísticas */
const S0=window.swapMatch;
window.swapMatch=function(id){
  const m=db.matches.find(x=>x.id===id),rec=m&&MS()[id];
  const res=S0.apply(this,arguments);
  try{
    if(hasAny(rec)){
      const n={ts:Date.now()};
      FIELDS.forEach(([k])=>{const o=rec[k];if(o){const z={};if(o.a!=null)z.b=o.a;if(o.b!=null)z.a=o.b;n[k]=z}});
      mstatsPut(id,n);
    }
  }catch(e){console.error('Estadísticas:',e)}
  return res;
};
/* Si se borra un partido o un rival, se borran sus estadísticas */
const D0=window.delMatch;
window.delMatch=function(id){
  const res=D0.apply(this,arguments);
  try{if(MS()[id]&&!db.matches.some(x=>x.id===id))mstatsDel(id)}catch(e){console.error('Estadísticas:',e)}
  return res;
};
const X0=window.delRival;
window.delRival=function(id){
  const ids=db.matches.filter(m=>m.rid===id).map(m=>m.id);
  const res=X0.apply(this,arguments);
  try{if(!rv(id))ids.forEach(i=>{if(MS()[i])mstatsDel(i)})}catch(e){console.error('Estadísticas:',e)}
  return res;
};

/* Botón 📊 en cada partido del historial */
function inject(){
  const ms=MS();
  document.getElementById('app').querySelectorAll('.m').forEach(row=>{
    const sw=row.querySelector('button[onclick^="swapMatch"]');
    if(!sw||row.querySelector('.xbtn'))return;
    const id=((sw.getAttribute('onclick')||'').match(/'([^']+)'/)||[])[1];if(!id)return;
    const b=document.createElement('button');
    b.className='ic xbtn'+(hasAny(ms[id])?' on':'');b.textContent='📊';
    b.title=hasAny(ms[id])?'Ver estadísticas':'Cargar estadísticas';
    b.setAttribute('onclick',"statsView('"+id+"')");
    sw.parentNode.insertBefore(b,sw);
  });
}
const R5=window.render;
window.render=function(){R5();try{inject()}catch(e){console.error('Estadísticas:',e)}};
window.render();
})();
</script>

<style>
/* ===== OCR DE CAPTURA v2 (solo estilos nuevos) ===== */
.ocr-box{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.ocr-box select{font-size:15px;padding:8px;margin:6px 0 8px}
.ocr-box .btn{width:100%}
.ocr-msg{font-size:13px;color:#8b95a9;margin-top:8px;line-height:1.35}
.xs input.ocr-dud{outline:2px solid #eab308;background:#eab30822}
</style>
<script>
/* ===== OCR DE CAPTURA v2: lee una captura en el navegador (Tesseract.js) y SOLO rellena el formulario de estadísticas.
   No guarda nada solo: vos revisás y tocás "Guardar" (que usa el guardado y las validaciones que ya existen).
   La imagen no se sube ni se guarda: se procesa en memoria y se descarta. No toca rivals, matches ni Firebase.
   Método principal: la pantalla de eFootball tiene la tabla siempre en el mismo lugar con 13 filas iguales,
   así que se recorta cada número (izquierda/derecha de cada fila) y se lee por separado.
   Si la captura tiene otra proporción, se usa un método alternativo que lee todo el texto y busca las etiquetas. ===== */
(function(){
/* posición de la tabla como fracción de la imagen (medida sobre capturas reales 20:9) */
const LAYOUT={tx0:.34,tx1:.66,ty0:.2745,ty1:.852,cell:.27,score:[[.449,.480],[.520,.551]],sy:[.155,.222],ar:[2.05,2.45]};

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];
}
/* texto leído -> número entero (0-999) o null */
function clean(s){
  s=String(s||'').replace(/%/g,'').replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/\D/g,'');
  return s&&s.length<=3?Number(s):null;
}
/* varias lecturas -> {v, n}: valor más repetido y cuántas lecturas lo respaldan */
function vote(arr){
  const c={};arr.filter(x=>x!=null).forEach(x=>c[x]=(c[x]||0)+1);
  let best=null,n=0;Object.keys(c).forEach(k=>{if(c[k]>n){n=c[k];best=Number(k)}});
  return{v:best,n};
}

/* ---------- método alternativo (captura con otra proporción): leer todo y buscar etiquetas ---------- */
const ALIAS={pos:['posesion'],shots:['tiros'],sot:['tirosalarco','disparosaporteria'],corn:['saquesdeesquina','corners'],fk:['tiroslibres'],saves:['atajadas']};
function cands(){
  const out=[];
  (window.MSTAT_FIELDS||[]).forEach(([k,l])=>{out.push([k,norm(l)]);(ALIAS[k]||[]).forEach(a=>out.push([k,a]))});
  return out;
}
function matchLabel(text){
  const n=norm(text);if(n.length<4)return null;
  let best=null;
  cands().forEach(([k,c])=>{const r=lev(n,c)/Math.max(n.length,c.length);if(!best||r<best.ratio)best={k,ratio:r}});
  return best&&best.ratio<=0.34?best:null;
}
const isNum=t=>/^[\dOoIl|]{1,3}%?$/.test(t)&&/\d/.test(t);
function parse(words){
  const ws=words.filter(w=>w.text&&w.text.trim()).map(w=>({...w,text:w.text.trim(),cy:(w.y0+w.y1)/2,h:w.y1-w.y0}));
  if(!ws.length)return{rows:{},score:null};
  const hs=ws.map(w=>w.h).sort((a,b)=>a-b),mh=hs[Math.floor(hs.length/2)]||10;
  ws.sort((a,b)=>a.cy-b.cy);
  const lines=[];
  ws.forEach(w=>{const L=lines[lines.length-1];if(L&&Math.abs(w.cy-L.cy)<=mh*0.6){L.w.push(w);L.cy=L.w.reduce((s,x)=>s+x.cy,0)/L.w.length}else lines.push({cy:w.cy,w:[w]})});
  const rows={};let score=null;
  lines.forEach(L=>{
    L.w.sort((a,b)=>a.x0-b.x0);
    const nums=L.w.filter(w=>isNum(w.text)),txt=L.w.filter(w=>!isNum(w.text)&&norm(w.text).length>0);
    const lab=txt.length?matchLabel(txt.map(w=>w.text).join(' ')):null;
    if(!lab){
      if(!score&&!txt.length){const mm=L.w.map(w=>w.text).join(' ').match(/(\d{1,2})\s*[-–—:]\s*(\d{1,2})/);if(mm)score={l:Number(mm[1]),r:Number(mm[2])}}
      return;
    }
    const lx0=Math.min(...txt.map(w=>w.x0)),lx1=Math.max(...txt.map(w=>w.x1));
    const left=nums.filter(w=>(w.x0+w.x1)/2<lx0).pop(),right=nums.find(w=>(w.x0+w.x1)/2>lx1);
    const row={a:left?clean(left.text):null,b:right?clean(right.text):null};
    const lowc=[left,right].some(w=>w&&w.conf!=null&&w.conf<60);
    row.dud=lab.ratio>0.18||row.a==null||row.b==null||lowc;
    row.ratio=lab.ratio;
    if(!rows[lab.k]||lab.ratio<rows[lab.k].ratio)rows[lab.k]=row;
  });
  return{rows,score};
}
window.OCRX={parse,lev,norm,matchLabel,clean,vote,LAYOUT};

/* ---------- imagen -> blanco y negro (texto oscuro sobre fondo claro), con margen blanco ---------- */
function binarize(c,pad){
  const x=c.getContext('2d',{willReadFrequently:true});
  const im=x.getImageData(0,0,c.width,c.height),d=im.data,N=c.width*c.height,g=new Uint8Array(N),hist=new Array(256).fill(0);
  let sum=0;
  for(let i=0;i<N;i++){const v=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000|0;g[i]=v;hist[v]++;sum+=v}
  let sB=0,wB=0,mx=0,thr=128;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mx){mx=v;thr=t}}
  const darkBg=sum/N<128;
  for(let i=0;i<N;i++){const bright=g[i]>thr,o=(bright===darkBg)?0:255;d[i*4]=d[i*4+1]=d[i*4+2]=o;d[i*4+3]=255}
  x.putImageData(im,0,0);
  const out=document.createElement('canvas');out.width=c.width+pad*2;out.height=c.height+pad*2;
  const ox=out.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,out.width,out.height);ox.drawImage(c,pad,pad);
  c.width=c.height=0;
  return out;
}
async function loadBitmap(file){
  try{return await createImageBitmap(file)}catch(e){
    return await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});
  }
}
/* recorte (fracciones de la imagen) escalado a alto fijo; soft = pasa por una versión más chica (otra "vista" del mismo número) */
function cellCanvas(bmp,fx0,fx1,fy0,fy1,soft){
  const W=bmp.width,H=bmp.height,sx=fx0*W,sy=fy0*H,sw=(fx1-fx0)*W,sh=(fy1-fy0)*H;
  const th=90,tw=Math.max(8,Math.round(sw*th/sh));
  const c=document.createElement('canvas');c.width=tw;c.height=th;
  const cx=c.getContext('2d',{willReadFrequently:true});
  if(soft){
    const h2=60,w2=Math.max(4,Math.round(sw*h2/sh)),s=document.createElement('canvas');s.width=w2;s.height=h2;
    s.getContext('2d').drawImage(bmp,sx,sy,sw,sh,0,0,w2,h2);
    cx.drawImage(s,0,0,w2,h2,0,0,tw,th);s.width=s.height=0;
  }else cx.drawImage(bmp,sx,sy,sw,sh,0,0,tw,th);
  return binarize(c,12);
}
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar el lector (¿sin conexión?)'));
    document.head.appendChild(s);
  });
}

/* ---------- método principal: celda por celda ---------- */
async function readByLayout(bmp,onProg){
  const L=LAYOUT,keys=(window.MSTAT_FIELDS||[]).map(f=>f[0]);
  const worker=await Tesseract.createWorker('eng');
  try{
    const reads=async(box,psm,softs)=>{
      await worker.setParameters({tessedit_pageseg_mode:psm});
      const out=[];
      for(const soft of softs){
        const cv=cellCanvas(bmp,box[0],box[1],box[2],box[3],soft);
        const {data}=await worker.recognize(cv);cv.width=cv.height=0;
        out.push(clean(data.text));
      }
      return out;
    };
    /* devuelve {v, dud}: 2 lecturas que coinciden = confiable; si no, se agregan 2 más y se vota */
    const readCell=async box=>{
      let r=await reads(box,'7',[false,true]);
      if(r[0]!=null&&r[0]===r[1])return{v:r[0],dud:false};
      r=r.concat(await reads(box,'8',[false,true]));
      const w=vote(r);
      return{v:w.v,dud:w.v==null||w.n<3};
    };
    const p=(L.ty1-L.ty0)/keys.length,cw=L.cell*(L.tx1-L.tx0);
    const rows={};let nulls=0;
    for(let k=0;k<keys.length;k++){
      if(onProg)onProg(k/(keys.length+1),'fila '+(k+1)+' de '+keys.length);
      const y0=L.ty0+k*p+0.12*p,y1=L.ty0+k*p+0.84*p;
      const A=await readCell([L.tx0,L.tx0+cw,y0,y1]),B=await readCell([L.tx1-cw,L.tx1,y0,y1]);
      let a=A.v,b=B.v,dud=A.dud||B.dud;
      const mx=keys[k]==='pos'?100:999;
      if(a!=null&&a>mx){a=null;dud=true}if(b!=null&&b>mx){b=null;dud=true}
      if(a==null)nulls++;if(b==null)nulls++;
      rows[keys[k]]={a,b,dud:dud||a==null||b==null};
    }
    if(onProg)onProg(keys.length/(keys.length+1),'resultado');
    const sc=[];
    for(const sx of L.score){const c=await readCell([sx[0],sx[1],L.sy[0],L.sy[1]]);sc.push(c.v)}
    const score=sc[0]!=null&&sc[1]!=null?{l:sc[0],r:sc[1]}:null;
    return{rows,score,ok:nulls<=6};
  }finally{try{await worker.terminate()}catch(e){}}
}

/* ---------- método alternativo: toda la imagen ---------- */
const toWords=data=>(data.words||[]).map(w=>({text:w.text,x0:w.bbox.x0,y0:w.bbox.y0,x1:w.bbox.x1,y1:w.bbox.y1,conf:w.confidence}));
async function readWhole(bmp,onProg){
  /* se recorta la zona central, donde está la tabla, para que el fondo no confunda al lector */
  const W=bmp.width,H=bmp.height,fx0=.25,fx1=.75,fy0=.14,fy1=.9;
  const sw=(fx1-fx0)*W,sh=(fy1-fy0)*H;let sc=Math.max(1,Math.min(2.5,1600/sw));if(sh*sc>4500)sc=4500/sh;
  const c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  c.getContext('2d',{willReadFrequently:true}).drawImage(bmp,fx0*W,fy0*H,sw,sh,0,0,c.width,c.height);
  const cv=binarize(c,10);
  const worker=await Tesseract.createWorker('spa',1,{logger:m=>{if(m&&m.status==='recognizing text'&&onProg)onProg(m.progress,'')}});
  try{
    let best=null;
    for(const psm of ['6','11']){
      await worker.setParameters({tessedit_pageseg_mode:psm});
      const {data}=await worker.recognize(cv);
      const r=parse(toWords(data));
      if(!best||Object.keys(r.rows).length>Object.keys(best.rows).length)best=r;
      if(Object.keys(best.rows).length>=10)break;
    }
    return best;
  }finally{try{await worker.terminate()}catch(e){}cv.width=cv.height=0}
}

async function readImage(file,onProg){
  await loadTess();
  const bmp=await loadBitmap(file);
  try{
    const ar=bmp.width/bmp.height,L=LAYOUT;
    if(ar>=L.ar[0]&&ar<=L.ar[1]){
      const r=await readByLayout(bmp,onProg);
      if(r.ok){r.mode='celdas';return r}
    }
    const r=await readWhole(bmp,onProg);r.mode='general';return r;
  }finally{if(bmp.close)bmp.close()}
}

function addBox(id){
  const m=db.matches.find(x=>x.id===id),r=m&&rv(m.rid);if(!m||!r)return;
  const wrap=document.querySelector('#m>div');if(!wrap||wrap.querySelector('.ocr-box'))return;
  const anchor=wrap.querySelector('small');if(!anchor)return;
  const box=document.createElement('div');box.className='ocr-box';
  box.innerHTML=`<button class="btn alt" type="button" data-o="go">📷 Leer captura</button>
<input type="file" accept="image/*" hidden data-o="file">
<label style="display:block;margin-top:8px"><small>En la captura, a la izquierda está:</small>
<select data-o="side"><option value="me">${esc(meN(r))}</option><option value="op">${esc(opN(r))}</option></select></label>
<div class="ocr-msg" data-o="msg">La imagen se lee en tu celular y se descarta: no se sube ni se guarda. Después revisás todo antes de guardar.</div>`;
  anchor.insertAdjacentElement('afterend',box);
  const q=s=>box.querySelector('[data-o="'+s+'"]'),msg=t=>{q('msg').textContent=t};
  q('go').onclick=()=>q('file').click();
  q('file').onchange=async ev=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    const btn=q('go');btn.disabled=true;msg('Preparando la imagen…');
    try{
      const res=await readImage(f,(p,t)=>msg('Leyendo… '+Math.round(p*100)+' %'+(t?' ('+t+')':'')));
      const p=PM(m,r);let leftMe=q('side').value==='me',note='';
      if(res.score){
        const {l,r:rr}=res.score;
        if(l!==rr&&l===p.my&&rr===p.opp){leftMe=true;q('side').value='me'}
        else if(l!==rr&&l===p.opp&&rr===p.my){leftMe=false;q('side').value='op'}
        else if(l!==p.my&&l!==p.opp||rr!==p.my&&rr!==p.opp)note=' ⚠ El resultado que leí ('+l+'-'+rr+') no coincide con el del partido ('+p.my+'-'+p.opp+'): revisá que sea la captura correcta y el lado.';
        else note=' Con el resultado no pude saber qué lado es cada uno: revisá el selector.';
      }else note=' No pude leer el resultado: revisá el selector de lado.';
      const put=(k,s,v,dud)=>{const el=document.querySelector('#m [data-k="'+k+'"][data-s="'+s+'"]');if(!el)return;
        if(v!=null)el.value=v;
        if(dud||v==null){el.classList.add('ocr-dud');el.addEventListener('input',()=>el.classList.remove('ocr-dud'),{once:true})}};
      let n=0,d=0;
      Object.keys(res.rows).forEach(k=>{
        const row=res.rows[k],mx=k==='pos'?100:999;
        let a=row.a,b=row.b,dud=row.dud;
        if(a!=null&&a>mx){a=null;dud=true}if(b!=null&&b>mx){b=null;dud=true}
        const Lf=leftMe?a:b,Rt=leftMe?b:a;
        put(k,'l',Lf,dud);put(k,'r',Rt,dud);
        n++;if(dud)d++;
      });
      /* mismas reglas lógicas que ya usa el guardado: se marcan en amarillo si no cierran */
      const v=(k,s)=>{const e=document.querySelector('#m [data-k="'+k+'"][data-s="'+s+'"]');return e&&e.value!==''?Number(e.value):null};
      const mark=(k,s)=>{const e=document.querySelector('#m [data-k="'+k+'"][data-s="'+s+'"]');if(e)e.classList.add('ocr-dud')};
      const pl=v('pos','l'),pr=v('pos','r');if(pl!=null&&pr!=null&&pl+pr!==100){mark('pos','l');mark('pos','r');d++}
      ['l','r'].forEach(s=>{
        if(v('shots',s)!=null&&v('sot',s)!=null&&v('sot',s)>v('shots',s)){mark('shots',s);mark('sot',s);d++}
        if(v('pass',s)!=null&&v('passok',s)!=null&&v('passok',s)>v('pass',s)){mark('pass',s);mark('passok',s);d++}
      });
      msg(n?'Leí '+n+' de '+(window.MSTAT_FIELDS||[]).length+' estadísticas'+(res.mode==='general'?' (con el método general: esta captura tiene otra proporción, así que revisá bien).':'.')+(d?' Lo que quedó en amarillo es dudoso o está vacío: revisalo contra la captura.':'')+note+' Todavía no se guardó nada: revisá y tocá Guardar.'
            :'No pude leer estadísticas en esa imagen. Probá con una captura completa de la pantalla o cargá a mano.');
    }catch(e){
      console.error('OCR:',e);msg('No se pudo leer la captura: '+(e&&e.message?e.message:'error')+'. Podés cargar a mano.');
    }finally{
      btn.disabled=false;ev.target.value='';
    }
  };
}

if(typeof window.statsForm==='function'){
  const F0=window.statsForm;
  window.statsForm=function(id){
    const res=F0.apply(this,arguments);
    try{addBox(id)}catch(e){console.error('OCR:',e)}
    return res;
  };
}
})();
</script>

<script type="module">
/* ====== SINCRONIZACIÓN EN LA NUBE (Firebase / Realtime Database) ====== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 👇 PEGÁ ACÁ TU CONFIG (Firebase → Configuración del proyecto → Tus apps → Web) */
const firebaseConfig={
  apiKey:"AIzaSyBZ2c9dnhEl6pjzrAIui-bKKsc_jwoIj9U",
  authDomain:"iator-db2c9.firebaseapp.com",
  databaseURL:"https://iator-db2c9-default-rtdb.firebaseio.com",
  projectId:"iator-db2c9",
  storageBucket:"iator-db2c9.firebasestorage.app",
  messagingSenderId:"397322044767",
  appId:"1:397322044767:web:470cb48e2789a1b97ea2ea"
};

const badge=document.getElementById('cloud');
let online=false,fail=false;
function paint(){
  if(fail){badge.textContent='☁️ Error · revisá las reglas de Firebase';badge.style.color='#ef4444';return}
  if(!navigator.onLine||!online){badge.textContent='☁️ Sin conexión · guardado en el dispositivo';badge.style.color='#eab308';return}
  badge.textContent='☁️ Sincronizado';badge.style.color='#22c55e';
}

if(Object.values(firebaseConfig).some(v=>String(v).startsWith('PEGAR'))){
  badge.textContent='☁️ Falta pegar el firebaseConfig';badge.style.color='#eab308';
}else start();

function start(){
  const app=initializeApp(firebaseConfig);
  const rt=getDatabase(app);
  const P={r:'iator/rivals',m:'iator/matches'};
  const KN=K+'_known';
  const ser=o=>JSON.stringify(Object.keys(o).sort().reduce((a,k)=>(a[k]=o[k],a),{}));
  const sRival=r=>({id:r.id,name:r.name,ts:r.ts||0});
  const sMatch=m=>({id:m.id,rid:m.rid,my:m.my,opp:m.opp,date:m.date,old:!!m.old,ts:m.ts||0});
  const onErr=e=>{console.error('Firebase:',e);fail=true;paint()};

  let remR=null,remM=null,ready=false;
  const sent={r:{},m:{}};   // lo último que sabemos que está en la nube

  function remember(){
    localStorage.setItem(KN,JSON.stringify([...Object.keys(sent.r),...Object.keys(sent.m)]));
  }
  function push(k,list){
    const ids=new Set();
    list.forEach(o=>{
      ids.add(o.id);
      const s=ser(o);
      if(sent[k][o.id]!==s){sent[k][o.id]=s;set(ref(rt,P[k]+'/'+o.id),o).catch(onErr)}
    });
    Object.keys(sent[k]).forEach(id=>{
      if(!ids.has(id)){delete sent[k][id];remove(ref(rt,P[k]+'/'+id)).catch(onErr)}
    });
  }
  function sync(){
    if(!ready)return;
    db.rivals.forEach((r,i)=>{if(!r.ts)r.ts=Date.now()+i});
    localStorage.setItem(K,JSON.stringify(db));
    push('r',db.rivals.map(sRival));
    push('m',db.matches.map(sMatch));
    remember();
  }
  window.cloudSync=sync;

  // "Soy X" (flip) es una preferencia de cada dispositivo: no se sube
  const withFlips=(list,flips)=>list
    .map(r=>({...r,flip:!!flips[r.id]}))
    .sort((a,b)=>(a.ts||0)-(b.ts||0)||a.name.localeCompare(b.name));
  const mark=()=>{
    sent.r={};sent.m={};
    Object.keys(remR).forEach(id=>sent.r[id]=ser(remR[id]));
    Object.keys(remM).forEach(id=>sent.m[id]=ser(remM[id]));
  };

  function apply(){
    const flips=Object.fromEntries(db.rivals.map(r=>[r.id,r.flip]));
    db.rivals=withFlips(Object.values(remR),flips);
    db.matches=Object.values(remM);
    mark();
    localStorage.setItem(K,JSON.stringify(db));
    remember();render();paint();
  }

  function initial(){
    const known=JSON.parse(localStorage.getItem(KN)||'null');
    const lr=db.rivals.filter(r=>!remR[r.id]),lm=db.matches.filter(m=>!remM[m.id]);
    const remoteEmpty=!Object.keys(remR).length&&!Object.keys(remM).length;
    let keepR=lr,keepM=lm;
    if(known===null){
      // primera vez en este dispositivo
      if(!remoteEmpty&&(lr.length||lm.length)){
        if(!confirm('Este dispositivo tiene '+lm.length+' partido(s) y '+lr.length+' rival(es) que no están en la nube.\n\n¿Subirlos? (Aceptar = subir y juntar, Cancelar = descartarlos y usar solo lo de la nube)')){keepR=[];keepM=[]}
      }
    }else{
      // lo que ya estaba sincronizado y ya no está en la nube se borró desde otro dispositivo
      const ks=new Set(known);
      keepR=lr.filter(r=>!ks.has(r.id));keepM=lm.filter(m=>!ks.has(m.id));
    }
    const flips=Object.fromEntries(db.rivals.map(r=>[r.id,r.flip]));
    db.rivals=withFlips([...Object.values(remR),...keepR],flips);
    db.matches=[...Object.values(remM),...keepM];
    mark();
    ready=true;
    sync();render();paint();
  }

  const step=()=>{if(remR&&remM){ready?apply():initial()}};
  onValue(ref(rt,P.r),s=>{remR=s.val()||{};fail=false;step()},onErr);
  onValue(ref(rt,P.m),s=>{remM=s.val()||{};fail=false;step()},onErr);
  onValue(ref(rt,'.info/connected'),s=>{online=s.val()===true;paint()});
  addEventListener('online',paint);addEventListener('offline',paint);
  paint();
}
</script>
<script type="module">
/* ===== ESTADÍSTICAS DE PARTIDO v1: sincronización del nodo iator/mstats. Módulo aparte: no modifica el módulo de arriba. ===== */
import {getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let app=null;
try{app=getApp()}catch(e){console.warn('Estadísticas: sin Firebase, quedan solo en el dispositivo')}
if(app){
  const rt=getDatabase(app),P='iator/mstats',KS='iator_mstats_known',KD='iator_mstats_del';
  const jl=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
  const ser=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
  const L=()=>db.mstats&&typeof db.mstats==='object'&&!Array.isArray(db.mstats)?db.mstats:(db.mstats={});
  const ok=(v,mx)=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=mx;
  function clean(o){
    if(!o||typeof o!=='object')return null;
    const r={ts:Number(o.ts)||0};let n=0;
    (window.MSTAT_FIELDS||[]).forEach(([k])=>{
      const v=o[k];if(!v||typeof v!=='object')return;
      const mx=k==='pos'?100:999,x={};
      if(ok(v.a,mx))x.a=v.a;if(ok(v.b,mx))x.b=v.b;
      if(x.a!==undefined||x.b!==undefined){r[k]=x;n++}
    });
    return n?r:null;
  }

  const bd=document.createElement('div');
  bd.id='cloud2';
  bd.style.cssText='position:fixed;right:12px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 34px);font-size:12px;color:#ef4444;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;z-index:5;display:none';
  bd.textContent='📊 Estadísticas: error · revisá las reglas de Firebase';
  document.body.appendChild(bd);
  let failed=false;
  const paint=()=>{bd.style.display=failed?'block':'none'};
  const onErr=e=>{console.error('Estadísticas (Firebase):',e);failed=true;paint()};

  const known=new Set(jl(KS,[]));
  const sent={};
  let ready=false;
  const saveKnown=()=>{try{localStorage.setItem(KS,JSON.stringify([...known]))}catch(e){}};
  const pushOne=(id,rec)=>{const s=ser(rec);if(sent[id]===s)return;sent[id]=s;set(ref(rt,P+'/'+id),rec).catch(onErr)};

  function flushDel(){
    jl(KD,[]).forEach(id=>{
      delete sent[id];known.delete(id);
      remove(ref(rt,P+'/'+id)).then(()=>{
        try{localStorage.setItem(KD,JSON.stringify(jl(KD,[]).filter(x=>x!==id)))}catch(e){}
      }).catch(onErr);
    });
    saveKnown();
  }

  function merge(R){
    const m=L(),del=new Set(jl(KD,[]));let changed=false;
    /* nube -> dispositivo */
    Object.keys(R).forEach(id=>{
      if(del.has(id))return;
      const r=clean(R[id]);if(!r)return;
      sent[id]=ser(r);
      const l=m[id]?clean(m[id]):null;
      if(!l){if(m[id]||!known.has(id)){m[id]=r;changed=true}}
      else if((r.ts||0)>(l.ts||0)&&ser(r)!==ser(l)){m[id]=r;changed=true}
      known.add(id);
    });
    /* dispositivo -> nube */
    Object.keys(m).forEach(id=>{
      const l=clean(m[id]);if(!l)return;
      if(R[id]===undefined){
        if(known.has(id)&&!del.has(id)){delete m[id];known.delete(id);changed=true}   /* se borró desde otro dispositivo */
        else pushOne(id,l);                                                           /* es nuevo de este dispositivo */
      }else{
        const r=clean(R[id]);
        if(r&&ser(r)!==ser(l)&&(l.ts||0)>(r.ts||0))pushOne(id,l);
      }
    });
    saveKnown();
    if(changed){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}render()}
  }

  window.mstatsSync=()=>{
    if(!ready)return;
    const m=L();
    Object.keys(m).forEach(id=>{const c=clean(m[id]);if(c)pushOne(id,c)});
  };
  window.mstatsFlush=()=>{if(ready)flushDel()};

  onValue(ref(rt,P),s=>{
    failed=false;paint();
    merge(s.val()||{});
    if(!ready){ready=true;flushDel()}
  },onErr);
}
</script>
