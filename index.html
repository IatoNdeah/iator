<script>
/* ===== LADO POR NOMBRE DE EQUIPO v1: después de leer la captura, lee los nombres de los dos equipos de la cabecera
   ("LOS PAPUS FC" / "LA TORTILLA FC") y deja elegido solo el selector "a la izquierda está".
   Así no depende de que ya hayas escrito el resultado ni de que no sea empate. Solo mueve ese selector: no cambia nada más.
   Envuelve window.ocrReadImage desde afuera, con try/catch: si falla, la lectura sigue como siempre. ===== */
(function(){
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];
}
/* ¿el texto leído contiene la clave (aceptando 1 letra mal leída)? */
function has(txt,key){
  const t=norm(txt),k=String(key||'');
  if(k.length<4||!t)return false;
  if(t.includes(k))return true;
  for(let i=0;i+k.length<=t.length;i++)if(lev(t.slice(i,i+k.length),k)<=1)return true;
  return false;
}
/* equipo propio: por defecto "papus" (Los Papus FC); se puede cambiar guardando otro texto en localStorage 'iator_myteam' */
function myKey(){try{return norm(localStorage.getItem('iator_myteam')||'')||'papus'}catch(e){return 'papus'}}
/* devuelve true si el equipo propio está a la izquierda de la captura, false si está a la derecha, null si no se puede saber */
function decide(left,right,rivalName){
  const k=myKey(),rk=norm(rivalName),uL=has(left,k),uR=has(right,k),rL=has(left,rk),rR=has(right,rk);
  if(uL&&!uR)return true;if(uR&&!uL)return false;
  if(rL&&!rR)return false;if(rR&&!rL)return true;
  return null;
}
/* valor del selector: 'me' = lo de la izquierda de la captura va a la izquierda del formulario (que es el propio salvo "Soy X") */
const selectFor=(leftIsUser,flip)=>(leftIsUser!==!!flip)?'me':'op';
window.SIDEX={norm,has,decide,selectFor};

/* ---------- lectura de los nombres (misma preparación de imagen que el resto del OCR) ---------- */
const BOX=[[.255,.445],[.555,.745]],Y=[.155,.222];
function crop(bmp,fx0,fx1,fy0,fy1){
  const W=bmp.width,H=bmp.height,sx=fx0*W,sy=fy0*H,sw=(fx1-fx0)*W,sh=(fy1-fy0)*H,th=90,tw=Math.max(8,Math.round(sw*th/sh));
  const c=document.createElement('canvas');c.width=tw;c.height=th;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,sx,sy,sw,sh,0,0,tw,th);
  const im=x.getImageData(0,0,tw,th),d=im.data,N=tw*th,g=new Uint8Array(N),hist=new Array(256).fill(0);let sum=0;
  for(let i=0;i<N;i++){const v=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000|0;g[i]=v;hist[v]++;sum+=v}
  let sB=0,wB=0,mx=0,thr=128;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mx){mx=v;thr=t}}
  const dark=sum/N<128;
  for(let i=0;i<N;i++){const o=((g[i]>thr)===dark)?0:255;d[i*4]=d[i*4+1]=d[i*4+2]=o;d[i*4+3]=255}
  x.putImageData(im,0,0);
  const out=document.createElement('canvas');out.width=tw+24;out.height=th+24;
  const ox=out.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,out.width,out.height);ox.drawImage(c,12,12);
  c.width=c.height=0;return out;
}
async function names(file){
  if(!window.Tesseract)return null;
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){return null}
  let worker;
  try{
    worker=await Tesseract.createWorker('eng');
    await worker.setParameters({tessedit_pageseg_mode:'7'});
    const out=[];
    for(const b of BOX){const cv=crop(bmp,b[0],b[1],Y[0],Y[1]);const {data}=await worker.recognize(cv);cv.width=cv.height=0;out.push(data.text||'')}
    return out;
  }finally{try{worker&&await worker.terminate()}catch(e){}if(bmp.close)bmp.close()}
}

const O0=window.ocrReadImage;
if(typeof O0==='function'){
  window.ocrReadImage=async function(file,onProg){
    const res=await O0.apply(this,arguments);
    try{
      if(onProg)onProg(0.97,'equipos');
      const r=view&&view.r?rv(view.r):null,nm=await names(file);
      if(nm){
        const left=decide(nm[0],nm[1],r?r.name:'');
        if(left!=null){
          res.leftIsUser=left;
          const v=selectFor(left,r&&r.flip);
          document.querySelectorAll('#m select[data-o="side"]').forEach(s=>{s.value=v});
        }
      }
    }catch(e){console.error('Lado por equipo:',e)}
    return res;
  };
}
})();
</script>
<script type="module">
/* ====== SINCRONIZACIÓN EN LA NUBE (Firebase / Realtime Database) ====== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 👇 PEGÁ ACÁ TU CONFIG (Firebase → Configuración del proyecto → Tus apps → Web) */
const firebaseConfig={
  apiKey:"AIzaSyBZ2c9dnhEl6pjzrAIui-bKKsc_jwoIj9U",
  authDomain:"iator-db2c9.firebaseapp.com",
  databaseURL:"https://iator-db2c9-default-rtdb.firebaseio.com",
  projectId:"iator-db2c9",
  storageBucket:"iator-db2c9.firebasestorage.app",
  messagingSenderId:"397322044767",
  appId:"1:397322044767:web:470cb48e2789a1b97ea2ea"
};

const badge=document.getElementById('cloud');
let online=false,fail=false;
function paint(){
  if(fail){badge.textContent='☁️ Error · revisá las reglas de Firebase';badge.style.color='#ef4444';return}
  if(!navigator.onLine||!online){badge.textContent='☁️ Sin conexión · guardado en el dispositivo';badge.style.color='#eab308';return}
  badge.textContent='☁️ Sincronizado';badge.style.color='#22c55e';
}

if(Object.values(firebaseConfig).some(v=>String(v).startsWith('PEGAR'))){
  badge.textContent='☁️ Falta pegar el firebaseConfig';badge.style.color='#eab308';
}else start();

function start(){
  const app=initializeApp(firebaseConfig);
  const rt=getDatabase(app);
  const P={r:'iator/rivals',m:'iator/matches'};
  const KN=K+'_known';
  const ser=o=>JSON.stringify(Object.keys(o).sort().reduce((a,k)=>(a[k]=o[k],a),{}));
  const sRival=r=>({id:r.id,name:r.name,ts:r.ts||0});
  const sMatch=m=>({id:m.id,rid:m.rid,my:m.my,opp:m.opp,date:m.date,old:!!m.old,ts:m.ts||0});
  const onErr=e=>{console.error('Firebase:',e);fail=true;paint()};

  let remR=null,remM=null,ready=false;
  const sent={r:{},m:{}};   // lo último que sabemos que está en la nube

  function remember(){
    localStorage.setItem(KN,JSON.stringify([...Object.keys(sent.r),...Object.keys(sent.m)]));
  }
  function push(k,list){
    const ids=new Set();
    list.forEach(o=>{
      ids.add(o.id);
      const s=ser(o);
      if(sent[k][o.id]!==s){sent[k][o.id]=s;set(ref(rt,P[k]+'/'+o.id),o).catch(onErr)}
    });
    Object.keys(sent[k]).forEach(id=>{
      if(!ids.has(id)){delete sent[k][id];remove(ref(rt,P[k]+'/'+id)).catch(onErr)}
    });
  }
  function sync(){
    if(!ready)return;
    db.rivals.forEach((r,i)=>{if(!r.ts)r.ts=Date.now()+i});
    localStorage.setItem(K,JSON.stringify(db));
    push('r',db.rivals.map(sRival));
    push('m',db.matches.map(sMatch));
    remember();
  }
  window.cloudSync=sync;

  // "Soy X" (flip) es una preferencia de cada dispositivo: no se sube
  const withFlips=(list,flips)=>list
    .map(r=>({...r,flip:!!flips[r.id]}))
    .sort((a,b)=>(a.ts||0)-(b.ts||0)||a.name.localeCompare(b.name));
  const mark=()=>{
    sent.r={};sent.m={};
    Object.keys(remR).forEach(id=>sent.r[id]=ser(remR[id]));
    Object.keys(remM).forEach(id=>sent.m[id]=ser(remM[id]));
  };

  function apply(){
    const flips=Object.fromEntries(db.rivals.map(r=>[r.id,r.flip]));
    db.rivals=withFlips(Object.values(remR),flips);
    db.matches=Object.values(remM);
    mark();
    localStorage.setItem(K,JSON.stringify(db));
    remember();render();paint();
  }

  function initial(){
    const known=JSON.parse(localStorage.getItem(KN)||'null');
    const lr=db.rivals.filter(r=>!remR[r.id]),lm=db.matches.filter(m=>!remM[m.id]);
    const remoteEmpty=!Object.keys(remR).length&&!Object.keys(remM).length;
    let keepR=lr,keepM=lm;
    if(known===null){
      // primera vez en este dispositivo
      if(!remoteEmpty&&(lr.length||lm.length)){
        if(!confirm('Este dispositivo tiene '+lm.length+' partido(s) y '+lr.length+' rival(es) que no están en la nube.\n\n¿Subirlos? (Aceptar = subir y juntar, Cancelar = descartarlos y usar solo lo de la nube)')){keepR=[];keepM=[]}
      }
    }else{
      // lo que ya estaba sincronizado y ya no está en la nube se borró desde otro dispositivo
      const ks=new Set(known);
      keepR=lr.filter(r=>!ks.has(r.id));keepM=lm.filter(m=>!ks.has(m.id));
    }
    const flips=Object.fromEntries(db.rivals.map(r=>[r.id,r.flip]));
    db.rivals=withFlips([...Object.values(remR),...keepR],flips);
    db.matches=[...Object.values(remM),...keepM];
    mark();
    ready=true;
    sync();render();paint();
  }

  const step=()=>{if(remR&&remM){ready?apply():initial()}};
  onValue(ref(rt,P.r),s=>{remR=s.val()||{};fail=false;step()},onErr);
  onValue(ref(rt,P.m),s=>{remM=s.val()||{};fail=false;step()},onErr);
  onValue(ref(rt,'.info/connected'),s=>{online=s.val()===true;paint()});
  addEventListener('online',paint);addEventListener('offline',paint);
  paint();
}
</script>
<script type="module">
/* ===== ESTADÍSTICAS DE PARTIDO v1: sincronización del nodo iator/mstats. Módulo aparte: no modifica el módulo de arriba. ===== */
import {getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,remove,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

let app=null;
try{app=getApp()}catch(e){console.warn('Estadísticas: sin Firebase, quedan solo en el dispositivo')}
if(app){
  const rt=getDatabase(app),P='iator/mstats',KS='iator_mstats_known',KD='iator_mstats_del';
  const jl=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
  const ser=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
  const L=()=>db.mstats&&typeof db.mstats==='object'&&!Array.isArray(db.mstats)?db.mstats:(db.mstats={});
  const ok=(v,mx)=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=mx;
  function clean(o){
    if(!o||typeof o!=='object')return null;
    const r={ts:Number(o.ts)||0};let n=0;
    (window.MSTAT_FIELDS||[]).forEach(([k])=>{
      const v=o[k];if(!v||typeof v!=='object')return;
      const mx=k==='pos'?100:999,x={};
      if(ok(v.a,mx))x.a=v.a;if(ok(v.b,mx))x.b=v.b;
      if(x.a!==undefined||x.b!==undefined){r[k]=x;n++}
    });
    return n?r:null;
  }

  const bd=document.createElement('div');
  bd.id='cloud2';
  bd.style.cssText='position:fixed;right:12px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 34px);font-size:12px;color:#ef4444;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;z-index:5;display:none';
  bd.textContent='📊 Estadísticas: error · revisá las reglas de Firebase';
  document.body.appendChild(bd);
  let failed=false;
  const paint=()=>{bd.style.display=failed?'block':'none'};
  const onErr=e=>{console.error('Estadísticas (Firebase):',e);failed=true;paint()};

  const known=new Set(jl(KS,[]));
  const sent={};
  let ready=false;
  const saveKnown=()=>{try{localStorage.setItem(KS,JSON.stringify([...known]))}catch(e){}};
  const pushOne=(id,rec)=>{const s=ser(rec);if(sent[id]===s)return;sent[id]=s;set(ref(rt,P+'/'+id),rec).catch(onErr)};

  function flushDel(){
    jl(KD,[]).forEach(id=>{
      delete sent[id];known.delete(id);
      remove(ref(rt,P+'/'+id)).then(()=>{
        try{localStorage.setItem(KD,JSON.stringify(jl(KD,[]).filter(x=>x!==id)))}catch(e){}
      }).catch(onErr);
    });
    saveKnown();
  }

  function merge(R){
    const m=L(),del=new Set(jl(KD,[]));let changed=false;
    /* nube -> dispositivo */
    Object.keys(R).forEach(id=>{
      if(del.has(id))return;
      const r=clean(R[id]);if(!r)return;
      sent[id]=ser(r);
      const l=m[id]?clean(m[id]):null;
      if(!l){if(m[id]||!known.has(id)){m[id]=r;changed=true}}
      else if((r.ts||0)>(l.ts||0)&&ser(r)!==ser(l)){m[id]=r;changed=true}
      known.add(id);
    });
    /* dispositivo -> nube */
    Object.keys(m).forEach(id=>{
      const l=clean(m[id]);if(!l)return;
      if(R[id]===undefined){
        if(known.has(id)&&!del.has(id)){delete m[id];known.delete(id);changed=true}   /* se borró desde otro dispositivo */
        else pushOne(id,l);                                                           /* es nuevo de este dispositivo */
      }else{
        const r=clean(R[id]);
        if(r&&ser(r)!==ser(l)&&(l.ts||0)>(r.ts||0))pushOne(id,l);
      }
    });
    saveKnown();
    if(changed){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}render()}
  }

  window.mstatsSync=()=>{
    if(!ready)return;
    const m=L();
    Object.keys(m).forEach(id=>{const c=clean(m[id]);if(c)pushOne(id,c)});
  };
  window.mstatsFlush=()=>{if(ready)flushDel()};

  onValue(ref(rt,P),s=>{
    failed=false;paint();
    merge(s.val()||{});
    if(!ready){ready=true;flushDel()}
  },onErr);
}
</script>
